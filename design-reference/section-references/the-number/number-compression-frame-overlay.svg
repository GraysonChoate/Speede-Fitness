<svg xmlns="http://www.w3.org/2000/svg" width="3420" height="1787" viewBox="0 0 3420 1787">
  <defs>
    <linearGradient id="leftDepth" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#172119" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#101611" stop-opacity=".28"/>
      <stop offset="1" stop-color="#080A09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandFadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA39A" stop-opacity=".42"/>
      <stop offset=".7" stop-color="#8FD63F" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8FD63F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandFadeRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9AA39A" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#8FD63F" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8FD63F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="white" stop-opacity=".08"/>
      <stop offset=".42" stop-color="white" stop-opacity=".8"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotField" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#9AA39A" fill-opacity=".28"/>
      <circle cx="16" cy="16" r="1.4" fill="#8FD63F" fill-opacity=".22"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1850" height="1787" fill="url(#dotFade)"/>
    </mask>
    <radialGradient id="nodeGlow">
      <stop offset="0" stop-color="#B2FF59" stop-opacity=".95"/>
      <stop offset=".15" stop-color="#8FD63F" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8FD63F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Dense black depth and sensor grain on the numeral side only. -->
  <rect x="0" y="90" width="1770" height="1600" fill="url(#leftDepth)"/>
  <rect x="40" y="160" width="500" height="1430" fill="url(#dotField)"
        mask="url(#dotMask)" opacity=".9"/>

  <!-- Open compression frame aligned to the numeral block. -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M520 560V470H650" stroke="#9AA39A" stroke-opacity=".52" stroke-width="3"/>
    <path d="M1340 470h150v90" stroke="#9AA39A" stroke-opacity=".52" stroke-width="3"/>
    <path d="M520 1190v105h130" stroke="#9AA39A" stroke-opacity=".46" stroke-width="3"/>
    <path d="M1340 1295h150v-105" stroke="#9AA39A" stroke-opacity=".46" stroke-width="3"/>

    <path d="M555 555v-55h78" stroke="#8FD63F" stroke-opacity=".25" stroke-width="2"/>
    <path d="M1360 500h94v55" stroke="#8FD63F" stroke-opacity=".25" stroke-width="2"/>
    <path d="M555 1205v55h78" stroke="#8FD63F" stroke-opacity=".2" stroke-width="2"/>
    <path d="M1360 1260h94v-55" stroke="#8FD63F" stroke-opacity=".2" stroke-width="2"/>
  </g>

  <!-- Horizontal pressure bands press inward without touching the numeral. -->
  <g>
    <rect x="82" y="545" width="390" height="3" fill="url(#bandFadeLeft)"/>
    <rect x="82" y="615" width="340" height="2.5" fill="url(#bandFadeLeft)" opacity=".9"/>
    <rect x="82" y="690" width="300" height="2.5" fill="url(#bandFadeLeft)" opacity=".78"/>
    <rect x="82" y="995" width="305" height="2.5" fill="url(#bandFadeLeft)" opacity=".78"/>
    <rect x="82" y="1070" width="345" height="2.5" fill="url(#bandFadeLeft)" opacity=".9"/>
    <rect x="82" y="1145" width="392" height="3" fill="url(#bandFadeLeft)"/>

    <rect x="1530" y="545" width="205" height="3" fill="url(#bandFadeRight)"/>
    <rect x="1575" y="615" width="160" height="2.5" fill="url(#bandFadeRight)" opacity=".86"/>
    <rect x="1610" y="690" width="125" height="2.5" fill="url(#bandFadeRight)" opacity=".7"/>
    <rect x="1610" y="995" width="125" height="2.5" fill="url(#bandFadeRight)" opacity=".7"/>
    <rect x="1575" y="1070" width="160" height="2.5" fill="url(#bandFadeRight)" opacity=".86"/>
    <rect x="1530" y="1145" width="205" height="3" fill="url(#bandFadeRight)"/>
  </g>

  <!-- Left calibration rail with clearly visible symbolic ticks. -->
  <g fill="none" stroke="#9AA39A" stroke-width="2.4">
    <path d="M240 410V1375" stroke-opacity=".34" stroke-dasharray="3 15"/>
    <path d="M205 440h70M218 505h44M205 570h70M218 635h44M205 700h70
             M218 765h44M205 830h70M218 895h44M205 960h70M218 1025h44
             M205 1090h70M218 1155h44M205 1220h70M218 1285h44M205 1350h70"
          stroke-opacity=".32"/>
  </g>

  <!-- Sparse vertical load bars at the central gutter. -->
  <g fill="#9AA39A">
    <rect x="1650" y="760" width="4" height="145" fill-opacity=".2"/>
    <rect x="1670" y="725" width="3" height="215" fill-opacity=".16"/>
    <rect x="1690" y="785" width="3" height="95" fill-opacity=".24"/>
    <rect x="1710" y="745" width="2.5" height="175" fill-opacity=".14"/>
  </g>

  <!-- Small symbolic particles and one anchoring glint. -->
  <g fill="#8FD63F">
    <circle cx="310" cy="500" r="3" fill-opacity=".58"/>
    <circle cx="420" cy="604" r="2.5" fill-opacity=".42"/>
    <circle cx="355" cy="1115" r="3" fill-opacity=".46"/>
    <circle cx="285" cy="1260" r="2.5" fill-opacity=".4"/>
    <circle cx="1585" cy="545" r="2.8" fill-opacity=".44"/>
    <circle cx="1645" cy="1145" r="2.8" fill-opacity=".4"/>
  </g>
  <circle cx="1488" cy="1295" r="54" fill="url(#nodeGlow)" opacity=".78" filter="url(#blur18)"/>
  <circle cx="1488" cy="1295" r="6.5" fill="#B2FF59" fill-opacity=".9"/>
</svg>
