<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="300" viewBox="0 0 2048 300">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100C"/>
      <stop offset=".52" stop-color="#111612"/>
      <stop offset="1" stop-color="#15121B"/>
    </linearGradient>
    <linearGradient id="navGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080A09" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#0B0D0C" stop-opacity=".90"/>
      <stop offset="1" stop-color="#0D0E0D" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65705F" stop-opacity=".18"/>
      <stop offset=".47" stop-color="#65705F" stop-opacity=".42"/>
      <stop offset="1" stop-color="#65705F" stop-opacity=".14"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r=".7" fill="#D5DAD2" fill-opacity=".16"/>
      <circle cx="25" cy="21" r=".55" fill="#91A386" fill-opacity=".20"/>
      <path d="M2 28H11M23 4H31" stroke="#8C9787" stroke-opacity=".12" stroke-width=".8"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- A hint of hero media under the translucent navigation. -->
  <rect width="2048" height="300" fill="url(#page)"/>
  <ellipse cx="460" cy="245" rx="420" ry="120" fill="#294335" fill-opacity=".42" filter="url(#blur)"/>
  <ellipse cx="1660" cy="238" rx="460" ry="145" fill="#46312E" fill-opacity=".34" filter="url(#blur)"/>

  <!-- Optical-black control rail. -->
  <rect x="0" y="18" width="2048" height="116" fill="url(#navGlass)"/>
  <rect x="0" y="18" width="2048" height="116" fill="url(#grain)" opacity=".68"/>
  <path d="M0 134H2048" stroke="url(#rail)" stroke-width="1.5"/>
  <path d="M0 18H2048" stroke="#8D9B87" stroke-opacity=".12"/>

  <!-- Logo placement guide; actual logo is composited into this space. -->
  <rect x="190" y="58" width="222" height="31" fill="none"/>

  <!-- Quiet status instead of a second pill. -->
  <g transform="translate(444 55)">
    <path d="M0 0v34M0 0h12M0 34h12M174 0h-12M174 0v34M174 34h-12"
          fill="none" stroke="#6C845A" stroke-opacity=".62" stroke-width="1.3"/>
    <circle cx="25" cy="17" r="4" fill="#B2FF59" filter="url(#nodeGlow)"/>
    <text x="42" y="22" fill="#B2FF59" font-family="Space Mono, monospace"
          font-size="13" font-weight="700">COMING SOON</text>
  </g>

  <!-- Navigation. -->
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="560">
    <text x="990" y="80" fill="#899188">Force</text>
    <text x="1086" y="80" fill="#F4F7F0">How it adapts</text>
    <text x="1252" y="80" fill="#899188">The machine</text>
    <text x="1410" y="80" fill="#899188">Athletes</text>
  </g>

  <!-- Active section rail. -->
  <path d="M1084 133H1190" stroke="#B2FF59" stroke-width="2.5"/>
  <circle cx="1190" cy="133" r="4.5" fill="#B2FF59" filter="url(#nodeGlow)"/>
  <path d="M990 128V134M1252 128V134M1410 128V134" stroke="#71806A" stroke-opacity=".48"/>

  <!-- Instagram glyph. -->
  <g transform="translate(1525 62)" fill="none" stroke="#919A91" stroke-width="2">
    <rect x="0" y="0" width="25" height="25" rx="6"/>
    <circle cx="12.5" cy="12.5" r="5.2"/>
    <circle cx="19.5" cy="5.8" r="1.3" fill="#919A91" stroke="none"/>
  </g>

  <!-- Compact command button, not a large pill. -->
  <g transform="translate(1592 43)">
    <rect width="198" height="66" rx="8" fill="#B2FF59"/>
    <rect x=".75" y=".75" width="196.5" height="64.5" rx="7.25"
          fill="none" stroke="#D7FFAC" stroke-opacity=".70" stroke-width="1.5"/>
    <text x="24" y="40" fill="#080A09" font-family="Inter, Arial, sans-serif"
          font-size="17" font-weight="750">See it first</text>
    <path d="M153 33H171M164 26l7 7-7 7" fill="none" stroke="#080A09"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fine calibration residue. -->
  <g stroke="#91A386" stroke-opacity=".22">
    <path d="M1890 45V107M1902 58V94M1914 50V102M1926 65V88"/>
    <path d="M740 31H810M820 31H866"/>
  </g>
  <g fill="#B2FF59" fill-opacity=".44">
    <circle cx="1902" cy="76" r="1.6"/>
    <circle cx="1926" cy="81" r="1.6"/>
  </g>
</svg>
