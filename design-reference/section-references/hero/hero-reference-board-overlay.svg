    <g>
      <circle cx="142" cy="444" r="18" fill="#0E120F" stroke="#B2FF59" stroke-opacity=".8"/>
      <text x="142" y="449" fill="#B2FF59">01</text>
    </g>
    <g>
      <circle cx="210" cy="802" r="18" fill="#0E120F" stroke="#B2FF59" stroke-opacity=".8"/>
      <text x="210" y="807" fill="#B2FF59">02</text>
    </g>
    <g>
      <circle cx="158" cy="968" r="18" fill="#0E120F" stroke="#B2FF59" stroke-opacity=".8"/>
      <text x="158" y="973" fill="#B2FF59">03</text>
    </g>
    <g>
      <circle cx="764" cy="330" r="18" fill="#0E120F" stroke="#F4F7F0" stroke-opacity=".65"/>
      <text x="764" y="335" fill="#F4F7F0">04</text>
    </g>
  </g>

  <g fill="none" stroke="#9AA39A" stroke-opacity=".28" stroke-width="1.5"
