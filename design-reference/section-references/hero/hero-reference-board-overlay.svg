    <path d="M160 444H245"/>
    <path d="M228 802H305"/>
    <path d="M176 968H300"/>
    <path d="M782 330H890"/>
  </g>

  <line x1="100" y1="1076" x2="1820" y2="1076" stroke="#9AA39A" stroke-opacity=".2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(100 1125)">
      <text fill="#B2FF59" font-size="14" font-weight="700" letter-spacing="2">01 / GHOSTED MEASUREMENT RESIDUE</text>
      <text y="31" fill="#9AA39A" font-size="17">Straight scan traces, broken segments, and sparse dots.</text>
      <text y="57" fill="#9AA39A" font-size="17">Keep them in the far-left 10-15% at 4-8% opacity.</text>
    </g>
    <g transform="translate(1010 1125)">
      <text fill="#B2FF59" font-size="14" font-weight="700" letter-spacing="2">02 / SINGLE ROUTED PULSE</text>
      <text y="31" fill="#9AA39A" font-size="17">One dim 3-5px pulse travels down one fixed trace.</text>
      <text y="57" fill="#9AA39A" font-size="17">Run once every 7-9 seconds; do not animate every line.</text>
    </g>
    <g transform="translate(100 1255)">
      <text fill="#B2FF59" font-size="14" font-weight="700" letter-spacing="2">03 / DIRECTIONAL TONAL FIELD</text>
      <text y="31" fill="#9AA39A" font-size="17">Near-black graphite-green exposure in the outer and lower fade.</text>
      <text y="57" fill="#9AA39A" font-size="17">It should read as depth, never as a visible green glow.</text>
    </g>
    <g transform="translate(1010 1255)">
      <text fill="#F4F7F0" font-size="14" font-weight="700" letter-spacing="2">04 / PROTECTED CONTENT ZONE</text>
      <text y="31" fill="#9AA39A" font-size="17">Nothing crosses the copy, form, navigation, video, or badge.</text>
      <text y="57" fill="#9AA39A" font-size="17">Maintain at least 48px of clear space around every element.</text>
    </g>
  </g>

  <text x="1820" y="1370" fill="#9AA39A" text-anchor="end"
